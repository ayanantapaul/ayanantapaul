name: Update Codeforces Heatmap

on:
  schedule:
    # Runs daily at 00:30 UTC. Adjust as you like (cron is UTC).
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap SVG
        env:
          CF_HANDLE: xunzi
          CF_MODE: ac        # "ac" = accepted solutions only, "all" = every submission
          OUTPUT_PATH: cf-heatmap.svg
          WEEKS: "53"
        run: python3 generate_cf_heatmap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- cf-heatmap.svg; then
            git add cf-heatmap.svg
            git commit -m "chore: update Codeforces heatmap"
            git push
          else
            echo "No changes to cf-heatmap.svg, skipping commit."
          fi
